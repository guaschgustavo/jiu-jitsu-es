name: Actualizar Torneos BJJ España (Smoothcomp)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-torneos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper de Smoothcomp
        run: python actualizar_smoothcomp.py

      - name: Generar páginas SEO por ciudad
        run: python generar_ciudades.py

      - name: Guardar cambios en torneos.json e index.html
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action Bot"
          git add torneos.json index.html sitemap.xml madrid barcelona valencia sevilla malaga
          git diff --staged --quiet || git commit -m "Auto-update: Torneos BJJ con enlaces directos"
          git push
