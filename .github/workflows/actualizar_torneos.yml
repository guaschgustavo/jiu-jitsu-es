name: Actualizar Calendario de Torneos BJJ

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente con 1 clic desde GitHub

permissions:
  contents: write

jobs:
  actualizar-torneos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de actualización y limpieza de torneos vencidos
        run: python actualizar_smoothcomp.py

      - name: Guardar cambios automáticamente en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add torneos.json index.html
          git diff --staged --quiet || (git commit -m "Auto-actualización semanal de calendario de torneos BJJ" && git push)
